<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>יועץ חכם · אברהם שמוץ · יועץ משכנתאות</title>
<style>body{font-family:Arial,sans-serif;background:#E9EDEC;color:#132227;display:grid;place-items:center;min-height:100vh;margin:0}.loading{text-align:center;padding:30px}.loading b{display:block;font-size:22px;margin-bottom:8px}.loading span{color:#4E5C61}</style>
</head>
<body>
<div class="loading"><b>יועץ חכם</b><span>טוען את הדמו…</span></div>
<script>
(async function(){
  try{
    const files=[1,2,3,4,5,6].map(n=>'yoetz-hacham-parts/v2-'+n+'.txt?v=2');
    const parts=await Promise.all(files.map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}));
    const b64=parts.join('');
    const raw=atob(b64);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><b>לא הצלחתי לטעון את הדמו</b><span>רענן את העמוד ונסה שוב.</span></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
