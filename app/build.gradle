plugins { id 'com.android.application' }

android {
    namespace 'com.semantika.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rachel88261.semantika'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('semantika-release.jks')
            storePassword 'Semantika2026!'
            keyAlias 'semantika'
            keyPassword 'Semantika2026!'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
